# Anchor the register in Bitcoin, weekly, with nobody at a keyboard.
#
# An anchor only proves what a file looked like on the day it was taken, and
# the register changes with every member and lock. So once a week this takes a
# dated copy of the register in anchors/, stamps that copy with OpenTimestamps
# (anchor/stamp.mjs) and commits copy and proof. Every proof therefore
# covers one exact set of bytes that stays in the repository forever.
#
# A new version of the declaration (spec/declaration-v2.txt and on) is stamped
# the first time this sees it without a proof, so it cannot be backdated, as
# version 1 was by hand on 28 October.
#
# Every day it also asks the calendar servers to finish any proof that is still
# waiting (anchor/verify.mjs). A proof older than three days that is
# still not in a block FAILS the run, so a broken anchor shows up as a red
# cross and an email rather than as silence.
#
# GitHub sometimes never starts a scheduled run (it skipped the one on
# 12 November), and a run that never starts cannot fail, so it shows no red
# cross. So this runs four times a day (every pass is harmless when there is
# nothing to do), and each run checks how long ago the previous one was. If
# the gap is over 30 hours, a day was skipped, and this run goes red at the
# end, after doing its work, so the email says so.
#
# Two jobs. The first installs and runs the anchoring library with no
# permission to change anything, and hands on only the proofs and snapshot it
# made. The second runs no library: it checks that what it was handed is just
# that (proofs, and a snapshot that is exactly the register it was taken
# from) and commits it. So a library gone bad can at worst hand on a bad
# proof, which verify.mjs reports.
#
# Uses no secrets: only the permission GitHub gives every repository's own jobs.
# Run it by hand from the Actions tab ("Run workflow").

name: Anchor the register

on:
  schedule:
    # Four times a day, at an odd minute away from the top of the hour.
    - cron: "41 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Take a new snapshot even if one is less than 7 days old"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Both this and the relay inbox push to main; a run waits for its turn.
concurrency:
  group: anchor-register
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Was an earlier run skipped?
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/anchor-register.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].created_at")
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "no earlier run to compare with"
            exit 0
          fi
          gap=$(( ( $(date -u +%s) - $(date -u -d "$prev" +%s) ) / 3600 ))
          echo "the previous run started $gap hour(s) ago ($prev)"
          if [ "$gap" -gt 30 ]; then
            echo "::error::No anchoring run started for $gap hours (the previous was $prev). GitHub skipped at least one scheduled run. This run is doing the work now."
            touch /tmp/skipped
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install the anchoring library
        working-directory: anchor
        run: npm ci --no-audit --no-fund

      - name: Finish any proof still waiting
        working-directory: anchor
        shell: bash
        run: |
          mkdir -p ../anchors
          for proof in ../anchors/*.ots; do
            [ -e "$proof" ] || continue
            file="${proof%.ots}"
            day=$(basename "$file" .json | sed 's/^registrations-//')
            age=$(( ( $(date -u +%s) - $(date -u -d "$day" +%s) ) / 86400 ))
            # A proof is finished, or reported, within a few days. verify.mjs
            # asks a block explorer about every block a proof names, so older
            # ones are not asked about again on every run.
            if [ "$age" -gt 14 ]; then continue; fi
            echo "== $file"
            node verify.mjs "$file" | tee /tmp/verify.out
            if grep -q "have not got it into a block" /tmp/verify.out; then
              echo "waiting, $age day(s) old"
              if [ "$age" -gt 3 ]; then
                echo "::error::$file is $age days old and still not in a Bitcoin block"
                exit 1
              fi
            fi
          done
          # Declaration versions: finished like the rest; the age alarm above
          # is for the register's dated snapshots only.
          for proof in ../spec/declaration-v*.txt.ots; do
            [ -e "$proof" ] || continue
            case "$proof" in *declaration-v1.txt.ots) continue ;; esac   # finished for good on 28 October
            node verify.mjs "${proof%.ots}" || true
          done

      - name: Anchor any new version of the declaration
        run: |
          for f in spec/declaration-v*.txt; do
            [ -e "$f" ] || continue
            [ -e "$f.ots" ] && continue
            echo "== stamping $f"
            (cd anchor && node stamp.mjs "../$f")
            test -s "$f.ots"
          done

      - name: Take a new snapshot if one is due
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today=$(date -u +%F)
          latest=$(ls anchors/registrations-*.json 2>/dev/null | sort | tail -1 || true)
          due=yes
          if [ -n "$latest" ] && [ "$FORCE" != "true" ]; then
            day=$(basename "$latest" .json | sed 's/^registrations-//')
            age=$(( ( $(date -u +%s) - $(date -u -d "$day" +%s) ) / 86400 ))
            [ "$age" -lt 7 ] && due=no
            echo "latest snapshot $day ($age days ago)"
          fi
          if [ "$due" = yes ] && [ -n "$latest" ] && cmp -s registrations.json "$latest"; then
            echo "register unchanged since $latest; nothing new to anchor"
            due=no
          fi
          if [ "$due" = yes ]; then
            cp registrations.json "anchors/registrations-$today.json"
            (cd anchor && node stamp.mjs "../anchors/registrations-$today.json")
            test -s "anchors/registrations-$today.json.ots"
          fi

      - name: Hand on what changed
        shell: bash
        run: |
          mkdir -p /tmp/handover
          git rev-parse HEAD > /tmp/handover/from
          if [ -f /tmp/skipped ]; then touch /tmp/handover/skipped; fi
          git add -A anchors spec
          git diff --cached --name-only --diff-filter=AM -z -- anchors spec | tar --null -T - -cf /tmp/handover/files.tar
          git diff --cached --name-status -- anchors spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anchor-handover
          path: /tmp/handover/
          retention-days: 3


  publish:
    needs: anchor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to commit the proofs and the snapshot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anchor-handover
          path: /tmp/handover
      - name: Check what was handed on, and commit it
        shell: bash
        run: |
          from=$(cat /tmp/handover/from)
          mkdir -p /tmp/in && tar -xf /tmp/handover/files.tar -C /tmp/in --no-same-owner --no-same-permissions
          bad=0
          while IFS= read -r -d '' f; do
            rel="${f#/tmp/in/}"
            case "$rel" in */*/*) echo "::error::$rel is in a folder this job never writes"; bad=1; continue ;; esac
            if [ -L "$f" ] || [ ! -f "$f" ]; then echo "::error::$rel is not an ordinary file"; bad=1; continue; fi
            case "$rel" in
              anchors/registrations-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json.ots|spec/declaration-v[0-9]*.txt.ots) ;;
              anchors/registrations-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json)
                # A snapshot must be exactly the register it was taken from, and new.
                if git cat-file -e "$from:$rel" 2>/dev/null; then echo "::error::$rel already exists"; bad=1; fi
                if ! git show "$from:registrations.json" | cmp -s - "$f"; then echo "::error::$rel is not the register it was taken from"; bad=1; fi ;;
              *) echo "::error::$rel is not something this job makes"; bad=1 ;;
            esac
          done < <(find /tmp/in -mindepth 1 \( -type f -o -type l \) -print0)
          if find /tmp/in -mindepth 1 ! -type f ! -type d | grep -q .; then echo "::error::the handover holds something other than files"; bad=1; fi
          [ "$bad" = 0 ] || exit 1
          cp -r /tmp/in/. .
          git config user.name "Crowdlock anchor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anchors spec
          if [ -z "$(git status --porcelain -- anchors spec)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "Anchor the register"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 5
          done
          echo "::error::could not push the anchor"
          exit 1

      - name: Say so if a day was skipped
        if: always()
        run: |
          if [ -f /tmp/handover/skipped ]; then
            echo "A scheduled run was skipped before this one. The work above is done; this is only the flag."
            exit 1
          fi
