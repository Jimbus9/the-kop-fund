# Checks that the public pages can run as published (every file they load is
# actually served), and that the fund's own file and register agree.
name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "registrations.json"
      - "relay/health.json"
      - "relay/announced.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tests/publishable.test.mjs
      # Every Crowdlock file, and every version of its declaration, against
      # its fingerprint: what the relay inbox checks before collecting.
      - run: node relay/check.mjs
