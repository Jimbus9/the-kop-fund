# Checks that this Crowdlock's records have only ever grown: no lock or member taken
# off or changed, no lock added past the inbox's rules, no commitment taken out
# of a proposal's pile, and no register moved to a new file
# (relay/register-history.mjs). Force-pushes to main are refused, so the
# history it reads is the whole one.
#
# It runs when somebody pushes a change to the records, and once a day for the
# relay inbox's own commits (a workflow's commits start no workflows).

name: Register history

on:
  push:
    branches: [main]
    paths: ["crowdlocks/**", "registrations.json", "commitments/**", "test/**", "relay/register-history.mjs", "relay/accept.mjs", "js/history.mjs", ".github/workflows/register-history.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node relay/register-history.mjs
